<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Silver Pine Media — Get a Quote</title><style>
:root{--pine:#173f3a;--gold:#c9a667;--ink:#172033;--paper:#f5f3ee}*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui;background:var(--paper);color:var(--ink)}
header,main{max-width:980px;margin:auto;padding:1.5rem}header{display:flex;justify-content:space-between;align-items:center;color:var(--pine)}.quote-layout{display:grid;grid-template-columns:1fr 1.4fr;gap:2rem;align-items:start}.intro{padding:1rem 0}.panel{background:#fff;border:1px solid #d8d2c6;border-radius:16px;padding:1.5rem;box-shadow:0 14px 35px #173f3a16}
form{display:grid;gap:1rem}label{display:grid;gap:.35rem;font-weight:700}input,textarea{font:inherit;padding:.8rem;border:1px solid #9da8a5;border-radius:8px}textarea{min-height:8rem;resize:vertical}button{width:max-content;padding:.8rem 1.25rem;border:0;border-radius:8px;background:var(--pine);color:#fff;font-weight:750;cursor:pointer}.optional{font-weight:400;color:#65706e}#result:empty{display:none}#result{padding:.8rem;border-radius:8px;background:#e7f3eb}
@media(max-width:700px){.quote-layout{grid-template-columns:1fr}}
</style></head><body data-endpoint="/api/quote-requests"><header><strong>Silver Pine Media</strong><nav aria-label="Primary"><a href="/quote" aria-current="page">Get a Quote</a></nav></header>
<main><div class="quote-layout"><section class="intro"><p>Project enquiries</p><h1>Tell us about your property</h1><p>Share the details below and our team will follow up with a tailored quote.</p></section>
<section class="panel"><form id="quote-form">
<label>Name<input name="name" autocomplete="name" required></label>
<label>Company <span class="optional">(optional)</span><input name="company" autocomplete="organization"></label>
<label>Phone Number<input name="phone_number" type="tel" autocomplete="tel" required></label>
<label>Email<input name="email" type="email" autocomplete="email" required></label>
<label>Job Description<textarea name="job_description" required></textarea></label>
<button type="submit">Request a quote</button><p id="result" role="status" aria-live="polite"></p>
</form></section></div></main><script src="app.js"></script></body></html>
