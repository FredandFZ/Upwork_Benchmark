<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Silver Pine Media — Pricing</title><style>
:root{--ink:#172033;--accent:#3659d9;--paper:#f4f7fb}*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui;background:var(--paper);color:var(--ink)}
header,main{max-width:1080px;margin:auto;padding:1.5rem}header{display:flex;justify-content:space-between;align-items:center}.intro{max-width:680px}.tier-picker{margin:1.5rem 0;padding:1rem;background:#fff;border:1px solid #d7deea;border-radius:12px}.tier-picker label{font-weight:700}.tier-picker select{margin-left:.7rem;padding:.65rem;border:1px solid #98a6bc;border-radius:8px}
.packages{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1rem}.package{background:#fff;border:1px solid #d7deea;border-radius:16px;padding:1.25rem;box-shadow:0 10px 25px #17203310}.price{font-size:2rem;font-weight:800;color:var(--accent);margin:.5rem 0}.band{color:#596579;min-height:3rem}
table{width:100%;border-collapse:collapse;margin-top:2rem;background:#fff}th,td{padding:.75rem;text-align:left;border-bottom:1px solid #d7deea}
@media(max-width:760px){.packages{grid-template-columns:1fr 1fr}}@media(max-width:480px){.packages{grid-template-columns:1fr}}
</style></head><body data-project="44035087"><header><strong>Silver Pine Media</strong><nav aria-label="Primary"><a href="#pricing">Pricing</a></nav></header>
<main id="pricing"><div class="intro"><h1>Property packages</h1><p>Choose a property size to see the predefined price for each of our four packages.</p></div>
<div class="tier-picker"><label for="square-footage-tier">Property square footage</label><select id="square-footage-tier">
<option value="under_1200_sqft">Under 1200 sqft</option><option value="1201_2400_sqft">1201–2400 sqft</option><option value="2401_3600_sqft">2401–3600 sqft</option><option value="3600_plus_sqft">3600+ sqft</option>
</select></div>
<section class="packages" aria-live="polite">
<article class="package" data-package="basic"><h2>Basic</h2><p class="price"></p><p class="band"></p></article>
<article class="package" data-package="essential"><h2>Essential</h2><p class="price"></p><p class="band"></p></article>
<article class="package" data-package="premium"><h2>Premium</h2><p class="price"></p><p class="band"></p></article>
<article class="package" data-package="signature"><h2>Signature</h2><p class="price"></p><p class="band"></p></article>
</section>
<table><caption>All predefined package prices</caption><thead><tr><th>Package</th><th>Under 1200</th><th>1201–2400</th><th>2401–3600</th><th>3600+</th></tr></thead><tbody id="price-matrix"></tbody></table>
</main><script src="app.js"></script></body></html>
