<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Silver Pine Media — Mixed-media portfolio</title><style>
:root{--ink:#172033;--accent:#3659d9;--paper:#f4f7fb}*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui;background:var(--paper);color:var(--ink)}
header,main{max-width:1080px;margin:auto;padding:1.5rem}header{display:flex;justify-content:space-between}.section{margin:1.5rem 0}.media-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem}.media-card{background:#fff;border:1px solid #d7deea;border-radius:14px;overflow:hidden;box-shadow:0 10px 25px #17203310}.photo,.media-card video{display:block;width:100%;aspect-ratio:16/10;object-fit:cover}.photo{background:linear-gradient(135deg,#9fb7dd,#e9eff8);display:grid;place-items:center;font-weight:700}.media-card figcaption{padding:.8rem}
@media(max-width:700px){.media-row{grid-template-columns:1fr}}
</style></head><body><header><strong>Silver Pine Media</strong><nav aria-label="Primary"><a href="#gallery">Gallery</a></nav></header><main>
<section id="home-portfolio" class="section"><h1>Portfolio</h1><div class="media-row" data-placement="homepage">
<figure class="media-card"><div class="photo" role="img" aria-label="Coastal property exterior">Photo</div><figcaption>Property photography</figcaption></figure>
<figure class="media-card"><video controls preload="metadata" aria-label="Temporary portfolio video"><source src="https://files.silverpine-media.example/scl/fi/b8r3w6k1m9q4t7v2x5p0/Coastal-Aerial-Narration.mp4?dl=0" type="video/mp4"></video><figcaption>Temporary portfolio video</figcaption></figure>
<figure class="media-card"><div class="photo" role="img" aria-label="Twilight property exterior">Photo</div><figcaption>Twilight photography</figcaption></figure>
</div></section>
<section id="gallery" class="section"><h2>Gallery</h2><p>Video is presented alongside portfolio pictures rather than in a separate video-only area.</p><div class="media-row" data-placement="gallery">
<figure class="media-card"><div class="photo" role="img" aria-label="Gallery property photo">Photo</div><figcaption>Gallery photo</figcaption></figure>
<figure class="media-card"><video controls preload="metadata" aria-label="Temporary portfolio video"><source src="https://files.silverpine-media.example/scl/fi/b8r3w6k1m9q4t7v2x5p0/Coastal-Aerial-Narration.mp4?dl=0" type="video/mp4"></video><figcaption>Temporary portfolio video</figcaption></figure>
<figure class="media-card"><div class="photo" role="img" aria-label="Gallery twilight photo">Photo</div><figcaption>Gallery twilight</figcaption></figure>
</div></section></main><script src="app.js"></script></body></html>
