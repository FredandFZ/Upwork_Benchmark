<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LumenArc workspace shell</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;--bg:#f4f2fa;--surface:#fff;--ink:#211a2b;--muted:#6f647a;--accent:#6842c2;--border:#ddd5e7}
[data-theme="dark"]{--bg:#17131e;--surface:#241d2e;--ink:#f5effc;--muted:#c1b7cc;--accent:#b69af7;--border:#453753}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);display:grid;grid-template:64px 1fr auto/240px 1fr;transition:background-color .15s,color .15s}
.shell-header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--border)}
.brand{font-size:1.05rem;font-weight:800;letter-spacing:.01em}.theme-picker{display:flex;gap:8px}.theme-picker button{border:1px solid var(--border);border-radius:999px;background:transparent;color:var(--ink);padding:7px 12px;font:inherit;cursor:pointer}.theme-picker button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.shell-nav{grid-row:2;padding:22px 14px;background:var(--surface);border-right:1px solid var(--border)}.shell-nav a{display:flex;align-items:center;gap:10px;color:var(--muted);text-decoration:none;padding:10px 12px;border-radius:9px}.shell-nav a[aria-current="page"]{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);font-weight:700}.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.canvas{padding:28px;max-width:1040px}.canvas-note{border:1px dashed var(--border);border-radius:14px;padding:24px;color:var(--muted);background:color-mix(in srgb,var(--surface) 55%,transparent)}
.shell-footer{grid-column:1/-1;display:flex;justify-content:space-between;padding:18px 24px;background:var(--surface);border-top:1px solid var(--border);color:var(--muted);font-size:.875rem}
@media(max-width:700px){body{grid-template:64px auto 1fr auto/1fr}.shell-nav{grid-row:auto;border-right:0;border-bottom:1px solid var(--border);display:flex;overflow:auto}.canvas{padding:20px}.shell-footer{flex-direction:column;gap:5px}}
</style></head><body data-project="43772711" data-theme="light">
<header class="shell-header" data-shell-component="header"><strong class="brand">LumenArc</strong><div class="theme-picker" role="group" aria-label="Color theme"><button type="button" data-theme-choice="light" aria-pressed="true">Light</button><button type="button" data-theme-choice="dark" aria-pressed="false">Dark</button></div></header>
<nav class="shell-nav" data-shell-component="side navigation panel" aria-label="Workspace"><a href="#overview" aria-current="page"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg>Overview</a><a href="#agents"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3"/><path d="M5 20c.6-4 2.9-6 7-6s6.4 2 7 6"/></svg>Agents</a><a href="#activity"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h4l2-6 4 12 2-6h4"/></svg>Activity</a></nav>
<main class="canvas" id="overview" data-style-scope="separate"><h1>Workspace canvas</h1><p class="canvas-note">Application screens live in this canvas. Their styling is intentionally outside the current shell treatment.</p></main>
<footer class="shell-footer" data-shell-component="footer"><span>LumenArc workspace</span><span>System status: local preview</span></footer><script src="app.js"></script></body></html>
