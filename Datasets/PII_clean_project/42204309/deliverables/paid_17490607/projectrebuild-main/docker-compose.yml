version: '3.8'

services:
  # Local blockchain node (Anvil)
  contracts:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: project-rebuild-node
    ports:
      - "8545:8545"  # RPC endpoint
      - "8546:8546"  # WebSocket endpoint (if needed)
    volumes:
      - .:/app
      - /app/node_modules
      - /app/lib
      - /app/out
    environment:
      - ANVIL_HOST=0.0.0.0
      - ANVIL_PORT=8545
    command: anvil --host 0.0.0.0 --port 8545
    networks:
      - rebuild-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f -X POST http://localhost:8545 -H 'Content-Type: application/json' -d '{\"jsonrpc\":\"2.0\",\"method\":\"eth_blockNumber\",\"params\":[],\"id\":1}' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Development service for running tests, compilation, etc.
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: project-rebuild-dev
    volumes:
      - .:/app
      - /app/node_modules
      - /app/lib
      - /app/out
    working_dir: /app
    networks:
      - rebuild-network
    depends_on:
      contracts:
        condition: service_healthy
    environment:
      - RPC_URL=http://contracts:8545
      - PRIVATE_KEY=${PRIVATE_KEY:-}
      - FOUNDER_WALLET=${FOUNDER_WALLET:-}
    # Default command can be overridden
    command: tail -f /dev/null  # Keep container running
    profiles:
      - dev

  # Test runner service
  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: project-rebuild-test
    volumes:
      - .:/app
      - /app/node_modules
      - /app/lib
      - /app/out
    working_dir: /app
    networks:
      - rebuild-network
    depends_on:
      contracts:
        condition: service_healthy
    environment:
      - RPC_URL=http://contracts:8545
    command: forge test
    profiles:
      - test

  # Compiler service
  compile:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: project-rebuild-compile
    volumes:
      - .:/app
      - /app/node_modules
      - /app/lib
      - /app/out
    working_dir: /app
    networks:
      - rebuild-network
    command: forge build
    profiles:
      - compile

networks:
  rebuild-network:
    driver: bridge

volumes:
  node_modules:
  lib:
  out:

